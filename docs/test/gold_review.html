<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gold Retrieval Review</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f6f3;
      --surface: #fff;
      --surface-soft: #faf9f7;
      --ink: #242320;
      --muted: #73706a;
      --line: #e8e4de;
      --line-strong: #d8d2c8;
      --green-bg: #edf3ec;
      --green: #346538;
      --red-bg: #fdebec;
      --red: #9f2f2d;
      --blue-bg: #e1f3fe;
      --blue: #1f6c9f;
      --yellow-bg: #fbf3db;
      --yellow: #7a5200;
      font-family: "SF Pro Display", "Helvetica Neue", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    button, select, input, textarea { font: inherit; }
    button, input, select, textarea { accent-color: var(--ink); }
    button {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      border-radius: 8px;
      padding: 9px 13px;
      cursor: pointer;
    }
    button:hover { border-color: #b8afa2; }
    button.primary { background: var(--ink); color: white; border-color: var(--ink); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247,246,243,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .shell { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
    .header-inner { padding: 18px 0 14px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 14px; }
    .controls { display: grid; grid-template-columns: minmax(220px,1fr) 180px auto auto auto; gap: 10px; margin-top: 14px; }
    .controls input[type="search"], .controls select {
      width: 100%; border: 1px solid var(--line-strong); border-radius: 8px;
      background: var(--surface); padding: 9px 11px; color: var(--ink);
    }
    .progress-wrap { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; margin-top: 12px; }
    .bar { height: 7px; background: #ebe7e0; border-radius: 999px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--ink); width: 0; transition: width .2s ease; }
    .stats { font-size: 13px; color: var(--muted); white-space: nowrap; }
    main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      margin-bottom: 22px;
      overflow: hidden;
    }
    .card.approved { outline: 2px solid rgba(52,101,56,.25); }
    .card.rejected { outline: 2px solid rgba(159,47,45,.25); }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 24px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-soft);
    }
    .shop { font-size: 26px; font-weight: 750; letter-spacing: -.03em; line-height: 1.1; }
    .id { margin-top: 6px; color: var(--muted); font-size: 13px; font-family: "SF Mono", monospace; }
    .tag {
      display: inline-flex; align-items: center; height: 26px; padding: 0 10px;
      border-radius: 999px; font-size: 12px; font-weight: 650;
      background: var(--blue-bg); color: var(--blue); white-space: nowrap;
    }
    .tag.pending { background: var(--yellow-bg); color: var(--yellow); }
    .tag.approved { background: var(--green-bg); color: var(--green); }
    .tag.rejected { background: var(--red-bg); color: var(--red); }
    .content { padding: 22px 24px 24px; }
    .question-label, .section-label {
      color: var(--muted); font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px;
    }
    .message { font-size: 22px; line-height: 1.35; font-weight: 650; letter-spacing: -.015em; }
    .history {
      margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--line-strong);
      color: var(--muted); font-size: 14px; white-space: pre-wrap;
    }
    .review-grid { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(320px,.9fr); gap: 18px; margin-top: 20px; }
    .panel { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .panel-title { padding: 11px 13px; background: #f4f1ec; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 13px; }
    .answer { padding: 13px; font-size: 14px; line-height: 1.65; max-height: 220px; overflow: auto; white-space: pre-wrap; }
    .facts { width: 100%; border-collapse: collapse; font-size: 13px; }
    .facts th, .facts td { padding: 9px 11px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .facts th { width: 42%; color: var(--muted); font-weight: 600; background: #fbfaf8; }
    .facts tr:last-child th, .facts tr:last-child td { border-bottom: 0; }
    .products { margin-top: 20px; }
    table.product-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .product-table th {
      padding: 10px 11px; color: var(--muted); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em; border-bottom: 1px solid var(--line-strong);
      background: #f4f1ec; text-align: left;
    }
    .product-table td { padding: 10px 11px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .product-table tr:last-child td { border-bottom: 0; }
    .thumb {
      width: 46px; height: 46px; border-radius: 8px; display: grid; place-items: center;
      background: #ebe7df; color: #625b51; font-weight: 800; font-size: 14px;
      border: 1px solid var(--line-strong); overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .product-name { font-weight: 650; line-height: 1.35; }
    .muted { color: var(--muted); }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .pill.ok { background: var(--green-bg); color: var(--green); }
    .pill.bad { background: var(--red-bg); color: var(--red); }
    .pill.neutral { background: #efede9; color: var(--muted); }
    .decision-row {
      display: flex; justify-content: space-between; align-items: center; gap: 14px;
      margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line);
    }
    .segmented { display: inline-grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
    .segmented label { padding: 10px 16px; cursor: pointer; background: var(--surface); font-weight: 650; }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented label:has(input[value="approved"]:checked) { background: var(--green-bg); color: var(--green); }
    .segmented label:has(input[value="rejected"]:checked) { background: var(--red-bg); color: var(--red); }
    .correction { display: none; margin-top: 16px; border: 1px solid #e8c7c8; background: #fffafa; border-radius: 12px; padding: 16px; }
    .rejected .correction { display: block; }
    .correction-title { color: var(--red); font-weight: 750; margin-bottom: 12px; }
    .form-grid { display: grid; grid-template-columns: repeat(4, minmax(150px,1fr)); gap: 10px; }
    .form-grid .wide { grid-column: 1 / -1; }
    label.field-label { display: block; color: var(--muted); font-size: 12px; font-weight: 650; }
    .correction input, .correction textarea {
      width: 100%; margin-top: 5px; border: 1px solid var(--line-strong); border-radius: 8px;
      padding: 9px 10px; background: white; color: var(--ink);
    }
    .correction textarea { min-height: 86px; resize: vertical; }
    .empty { padding: 60px; text-align: center; color: var(--muted); }
    @media (max-width: 860px) {
      .controls, .review-grid { grid-template-columns: 1fr; }
      .card-head { flex-direction: column; }
      .decision-row { align-items: stretch; flex-direction: column; }
      .form-grid { grid-template-columns: 1fr; }
      .product-table { display: block; overflow-x: auto; }
      .stats { white-space: normal; }
    }
  </style>
</head>
<body>
<header>
  <div class="shell header-inner">
    <h1>Gold Retrieval Review</h1>
    <div class="subtitle">ตรวจ draft gold ทีละเคส · reject ต้องใส่คำตอบที่ถูกต้องก่อน export</div>
    <div class="controls">
      <input id="q" type="search" placeholder="ค้นหา id / ร้าน / คำถาม">
      <select id="filter">
        <option value="all">ทั้งหมด</option>
        <option value="pending" selected>ยังไม่ review</option>
        <option value="approved">Approve</option>
        <option value="rejected">Reject</option>
      </select>
      <button id="export-review">Export review JSON</button>
      <button id="export-gold" class="primary">Export approved JSONL</button>
      <button id="reset">Reset</button>
    </div>
    <div class="progress-wrap">
      <div class="bar"><span id="bar"></span></div>
      <div id="stats" class="stats"></div>
    </div>
  </div>
</header>
<main id="list" class="shell"></main>
<script src="gold_retrieval.draft.js"></script>
<script>
const rows = window.GOLD_DRAFT_ROWS || [];
const storeKey = 'gold-retrieval-review-v1';
let state = JSON.parse(localStorage.getItem(storeKey) || '{}');
const list = document.getElementById('list');
const q = document.getElementById('q');
const filter = document.getElementById('filter');
const labels = ['expected_answer_mode','expected_product_type','expected_subtype','expected_target_device','expected_catalog_status'];

function esc(v) {
  return String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function csv(v) { return Array.isArray(v) ? v.join(', ') : (v || ''); }
function rowState(id) { return state[id] || {decision:'pending', correction:{}, note:''}; }
function setRow(id, patch) {
  state[id] = {...rowState(id), ...patch};
  localStorage.setItem(storeKey, JSON.stringify(state));
  renderStats();
}
function correction(id, key, value) {
  const s = rowState(id);
  s.correction = {...(s.correction || {}), [key]: value};
  setRow(id, s);
}
function statusOf(id) { return rowState(id).decision || 'pending'; }
function filteredRows() {
  const text = q.value.trim().toLowerCase();
  const f = filter.value;
  return rows.filter(r => {
    const st = statusOf(r.id);
    if (f !== 'all' && st !== f) return false;
    if (!text) return true;
    return [r.id, r.shop, r.message, r.note].join(' ').toLowerCase().includes(text);
  });
}
function renderStats() {
  const counts = {pending:0, approved:0, rejected:0};
  rows.forEach(r => counts[statusOf(r.id)]++);
  const done = counts.approved + counts.rejected;
  document.getElementById('stats').textContent =
    `${done}/${rows.length} reviewed · approve ${counts.approved} · reject ${counts.rejected} · pending ${counts.pending}`;
  document.getElementById('bar').style.width = rows.length ? `${done / rows.length * 100}%` : '0';
}
function statusTag(st) {
  const label = {pending:'Pending', approved:'Approved', rejected:'Rejected'}[st];
  return `<span class="tag ${st}">${label}</span>`;
}
function money(v) {
  if (!v) return '';
  if (typeof v === 'object') return `${v.min ?? ''}${v.min !== v.max ? '–' + v.max : ''} ${v.currency || ''}`.trim();
  return String(v);
}
function thumb(p) {
  const src = p.image || p.image_url || '';
  const letter = (p.product_type || p.name || 'P').trim()[0].toUpperCase();
  return src ? `<div class="thumb"><img src="${esc(src)}" alt="" loading="lazy"></div>` : `<div class="thumb">${esc(letter)}</div>`;
}
function productTable(review) {
  const products = review.products || [];
  if (!products.length) {
    return review.product_count ? `<div class="panel"><div class="panel-title">Candidate products</div><div class="answer">source มีสินค้า ${review.product_count} รายการ แต่ไม่มี product detail ใน replay</div></div>` : '';
  }
  return `<div class="panel products"><div class="panel-title">Candidate products · ${products.length}</div>
    <table class="product-table"><thead><tr>
      <th></th><th>Item ID</th><th>สินค้า</th><th>Type</th><th>Status</th><th>Sellable</th><th>Price</th>
    </tr></thead><tbody>${products.map(p => `<tr>
      <td>${thumb(p)}</td>
      <td class="muted">${esc(p.item_id)}</td>
      <td><div class="product-name">${esc(p.name)}</div><div class="muted">${esc(p.model_name || '')}</div></td>
      <td>${esc(p.product_type)}</td>
      <td>${esc(p.status)}</td>
      <td><span class="pill ${p.available ? 'ok' : 'bad'}">${p.available ? 'sellable' : 'not sellable'}</span></td>
      <td>${esc(money(p.price))}</td>
    </tr>`).join('')}</tbody></table></div>`;
}
function factsTable(r) {
  const facts = [
    ['Intent', r.intent], ['Answer mode', r.expected_answer_mode], ['Product type', r.expected_product_type],
    ['Subtype', r.expected_subtype], ['Target device', r.expected_target_device], ['Catalog status', r.expected_catalog_status],
    ['Acceptable item IDs', csv(r.acceptable_item_ids)], ['Must-not item IDs', csv(r.must_not_item_ids)],
    ['Must-not phrases', csv(r.must_not_phrases)], ['Requires evidence', csv(r.requires_evidence)]
  ];
  return `<div class="panel"><div class="panel-title">Expected draft</div><table class="facts"><tbody>
    ${facts.map(([k,v]) => `<tr><th>${k}</th><td>${esc(v || '—')}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function cleanRow(r) {
  const clean = {...r};
  delete clean._review;
  return clean;
}
function render() {
  const shown = filteredRows();
  renderStats();
  if (!shown.length) {
    list.innerHTML = '<div class="empty">ไม่มีรายการตาม filter นี้</div>';
    return;
  }
  list.innerHTML = shown.map(r => {
    const s = rowState(r.id);
    const review = r._review || {};
    const history = (r.history || []).map(h => `${h.role || 'user'}: ${h.text || h.message || ''}`).join('\n');
    return `<article class="card ${s.decision}" data-id="${esc(r.id)}">
      <div class="card-head">
        <div><div class="shop">${esc(r.shop)}</div><div class="id">${esc(r.id)} · ${esc(r.note || '')}</div></div>
        ${statusTag(s.decision)}
      </div>
      <div class="content">
        <div class="question-label">Customer message</div>
        <div class="message">${esc(r.message)}</div>
        ${history ? `<div class="history">${esc(history)}</div>` : ''}
        <div class="review-grid">
          <div class="panel"><div class="panel-title">Bot answer · ${esc(review.source || 'manual')}</div><div class="answer">${esc(review.answer || 'ไม่มี replay answer สำหรับ manual case')}</div></div>
          ${factsTable(r)}
        </div>
        ${productTable(review)}
        <div class="decision-row">
          <div class="muted">ตรวจข้อมูลกับ replay แล้วเลือกผล review</div>
          <div class="segmented">
            <label><input type="radio" name="d-${esc(r.id)}" value="approved" ${s.decision === 'approved' ? 'checked' : ''}>Approve</label>
            <label><input type="radio" name="d-${esc(r.id)}" value="rejected" ${s.decision === 'rejected' ? 'checked' : ''}>Reject</label>
          </div>
        </div>
        <div class="correction">
          <div class="correction-title">Reject — บอกคำตอบที่ถูกต้องก่อน export</div>
          <div class="form-grid">
            <label class="field-label wide">คำตอบที่ถูกต้อง *<textarea data-c="correct_answer">${esc(s.correction?.correct_answer || '')}</textarea></label>
            ${labels.map(k => `<label class="field-label">${k}<input data-c="${k}" value="${esc(s.correction?.[k] || '')}"></label>`).join('')}
            <label class="field-label">acceptable_item_ids<input data-c="acceptable_item_ids" value="${esc(s.correction?.acceptable_item_ids || '')}" placeholder="comma separated"></label>
            <label class="field-label">must_not_item_ids<input data-c="must_not_item_ids" value="${esc(s.correction?.must_not_item_ids || '')}" placeholder="comma separated"></label>
            <label class="field-label">must_not_phrases<input data-c="must_not_phrases" value="${esc(s.correction?.must_not_phrases || '')}" placeholder="comma separated"></label>
            <label class="field-label">reviewer note<input data-note="1" value="${esc(s.note || '')}"></label>
          </div>
        </div>
      </div>
    </article>`;
  }).join('');
}
function download(name, text, type='text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
function reviewed() {
  return rows.map(r => ({row:r, review:rowState(r.id)}));
}
function missingCorrections() {
  return reviewed().filter(x => x.review.decision === 'rejected' && !(x.review.correction?.correct_answer || '').trim());
}
document.getElementById('export-review').onclick = () => {
  download('gold_retrieval.review.json', JSON.stringify(reviewed().map(x => ({
    id:x.row.id, decision:x.review.decision, correction:x.review.correction || {}, note:x.review.note || ''
  })), null, 2), 'application/json');
};
document.getElementById('export-gold').onclick = () => {
  const pending = rows.filter(r => statusOf(r.id) === 'pending');
  const missing = missingCorrections();
  if (pending.length || missing.length) {
    alert(`ยัง export ไม่ได้: pending ${pending.length}, reject ที่ยังไม่ใส่คำตอบ ${missing.length}`);
    return;
  }
  const approved = rows.filter(r => statusOf(r.id) === 'approved').map(cleanRow);
  download('gold_retrieval.jsonl', approved.map(r => JSON.stringify(r)).join('\n') + '\n', 'application/jsonl');
};
document.getElementById('reset').onclick = () => {
  if (confirm('ล้างผล review ทั้งหมดใน browser นี้?')) {
    state = {};
    localStorage.removeItem(storeKey);
    render();
  }
};
list.addEventListener('change', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  if (e.target.name === `d-${id}`) {
    setRow(id, {decision:e.target.value});
    render();
  }
  if (e.target.dataset.c) correction(id, e.target.dataset.c, e.target.value);
  if (e.target.dataset.note) setRow(id, {note:e.target.value});
});
list.addEventListener('input', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  if (e.target.dataset.c) correction(id, e.target.dataset.c, e.target.value);
  if (e.target.dataset.note) setRow(id, {note:e.target.value});
});
q.addEventListener('input', render);
filter.addEventListener('change', render);
render();
</script>
</body>
</html>
